[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gtooth-wireless"
version = "0.1.0"
description = "Experimental wireless-only G-Tooth link-control reference implementation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Roland R. Gibson Jr."}]
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["gtooth*", "protocol*"]
